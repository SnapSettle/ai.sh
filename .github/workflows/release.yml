# Automatic releases. Every push to main that changes ai.sh:
#   1. checks the script,
#   2. reads the version you wrote in ai.sh (the VERSION= line near the top),
#   3. makes sure it is a new, higher version than every earlier release,
#   4. publishes a GitHub Release for exactly the commit you pushed, with the
#      files the installer and "ai.sh --update" download.
# This workflow never writes to the repository, so your local copy never falls
# behind because of a release. The only thing you do is raise VERSION in ai.sh
# when you change the script.
name: Release

on:
  push:
    branches: [main]
    paths: [ai.sh]
  workflow_dispatch: # lets you press "Run workflow" in the Actions tab

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed to see existing tags

      - name: Check the script
        run: |
          sh -n ai.sh
          shellcheck -S warning ai.sh

      - name: Read and check the version
        id: ver
        run: |
          version=$(sed -n 's/^VERSION="\(.*\)"$/\1/p' ai.sh | head -n 1)
          if ! printf '%s\n' "$version" | grep -Eq '^[0-9]+(\.[0-9]+)*$'; then
            echo "::error::The VERSION= line near the top of ai.sh says '$version'. It must be a date version such as 2026.11.15 or 2026.11.15.1."
            exit 1
          fi
          if [ "$(sh ./ai.sh --version)" != "ai.sh $version" ]; then
            echo "::error::ai.sh does not report the version written in its VERSION= line."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::Version $version is already released. You changed ai.sh without raising the VERSION= line near the top. Raise it (for example to a later date, or add .1), commit and push again."
            exit 1
          fi
          latest=$(git tag -l 'v[0-9]*' | sed 's/^v//' | sort -V | tail -n 1)
          if [ -n "$latest" ]; then
            top=$(printf '%s\n%s\n' "$latest" "$version" | sort -V | tail -n 1)
            if [ "$top" != "$version" ]; then
              echo "::error::Version $version is lower than the latest release ($latest). Versions must only go up. Raise the VERSION= line in ai.sh, commit and push again."
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build release files
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mkdir dist
          cp ai.sh dist/ai.sh
          printf '%s\n' "$VERSION" > dist/VERSION
          cd dist
          sha256sum ai.sh > ai.sh.sha256

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/ai.sh dist/ai.sh.sha256 dist/VERSION \
            --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
